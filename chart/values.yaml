namespace: vcluster-ocp
vclusterName: ocp

vcluster:
  version: "0.36.1"
  k8sVersion: "v1.36.0"

openshift:
  apiserver:
    image: ""  # Set via OPENSHIFT_APISERVER_IMAGE: oc adm release info --image-for=openshift-apiserver
    port: 8444
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    clientPort: 2479
    peerPort: 2480

security:
  runAsUser: null
  runAsNonRoot: true
  fsGroup: null
