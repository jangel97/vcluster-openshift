apiVersion: v1
kind: Namespace
metadata:
  name: openshift-operators
---
apiVersion: v1
kind: Namespace
metadata:
  name: opendatahub
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: global-operators
  namespace: openshift-operators
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: community-operators
  namespace: olm
spec:
  sourceType: grpc
  image: registry.redhat.io/redhat/community-operator-index:v4.21
  displayName: Red Hat Community Operators
  publisher: Red Hat
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opendatahub-operator
  namespace: openshift-operators
spec:
  channel: fast
  name: opendatahub-operator
  source: community-operators
  sourceNamespace: olm
