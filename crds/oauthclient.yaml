# Compatibility shim: OAuthClient is NOT a CRD in real OpenShift.
# It is a native API served by openshift-oauth-apiserver (alongside user.openshift.io).
# This CRD exists only because openshift-oauth-apiserver is not part of the vCluster
# control plane. The resource-syncer plugin watches these objects and syncs them to
# the host cluster, where the real OAuth API server handles them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: oauthclients.oauth.openshift.io
spec:
  group: oauth.openshift.io
  names:
    kind: OAuthClient
    listKind: OAuthClientList
    plural: oauthclients
    singular: oauthclient
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
