# Configuration for vcluster-openshift deployment.
# Edit this file to customize the deployment for your environment.

# Dedicated etcd sidecar for openshift-apiserver
etcd:
  image: quay.io/coreos/etcd:v3.5.17
  clientPort: 2479
  peerPort: 2480

# openshift-apiserver sidecar
openshiftApiserver:
  port: 8444

# openshift-controller-manager sidecar (ImageStream imports, build controller)
openshiftControllerManager:
  port: 8445

# cluster-policy-controller sidecar (SCC enforcement, RBAC policies)
clusterPolicyController:
  port: 10357

# openshift-oauth-apiserver sidecar (User, Group, OAuthClient APIs)
oauthApiserver:
  port: 8447

# OCP kube-apiserver (hyperkube) — replaces vanilla kube-apiserver for native SCC admission
# Image auto-detected from OCP release payload if not set
hyperkube: {}

# nginx reverse proxy for OAuth metadata discovery
nginx:
  image: nginxinc/nginx-unprivileged:1.27-alpine

# API groups served by openshift-apiserver.
# An APIService is registered for each group inside the vCluster.
apiGroups:
  - image.openshift.io
  - route.openshift.io
  - apps.openshift.io
  - build.openshift.io
  - project.openshift.io
  - authorization.openshift.io
  - template.openshift.io

# API groups served by openshift-oauth-apiserver.
# These get separate APIServices pointing to the oauth-apiserver service.
oauthApiGroups:
  - user.openshift.io
  - oauth.openshift.io

# Individual CRDs to fetch from the host OCP cluster.
crds:
  - clusterresourcequotas.quota.openshift.io
  - securitycontextconstraints.security.openshift.io
  - rolebindingrestrictions.authorization.openshift.io

# Fetch ALL CRDs matching these group suffixes from the host.
crdGroups:
  - config.openshift.io
  - operator.openshift.io
  - console.openshift.io
  - monitoring.coreos.com

# Resources to copy from the host OCP cluster into the vCluster
hostResources:
  - group: config.openshift.io
    resource: clusterversions
    name: version
  - group: config.openshift.io
    resource: authentications
    name: cluster
  - group: config.openshift.io
    resource: ingresses
    name: cluster
  - group: config.openshift.io
    resource: infrastructures
    name: cluster
