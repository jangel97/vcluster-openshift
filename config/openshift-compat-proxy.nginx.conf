load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

env KUBERNETES_SERVICE_HOST;
env KUBERNETES_SERVICE_PORT;

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    js_import main from /etc/nginx/proxy.js;
    js_fetch_verify off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream kube_apiserver {
        server 127.0.0.1:6444;
        keepalive 64;
    }

    # Port 6443: Front proxy for the vCluster API.
    # Intercepts OpenShift-specific non-API paths, passes everything else
    # through to the kube-apiserver on 6444.
    server {
        listen 6443 ssl;

        ssl_certificate /data/pki/apiserver.crt;
        ssl_certificate_key /data/pki/apiserver.key;
        ssl_verify_client off;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 0;

        location = /.well-known/oauth-authorization-server {
            js_content main.oauthMetadata;
        }

        location / {
            proxy_pass https://kube_apiserver;
            proxy_ssl_certificate /data/pki/front-proxy-client.crt;
            proxy_ssl_certificate_key /data/pki/front-proxy-client.key;
            proxy_ssl_verify off;

            proxy_set_header X-Remote-User kubernetes-super-admin;
            proxy_set_header X-Remote-Group system:masters;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # Port 8446: API aggregation backend for user.openshift.io.
    # Reached via APIService registration — the kube-apiserver authenticates
    # the caller and passes identity in X-Remote-User / X-Remote-Group headers.
    # This proxy translates those into Kubernetes impersonation headers and
    # forwards to the host cluster's user.openshift.io API.
    server {
        listen 8446 ssl;

        ssl_certificate /data/pki/apiserver.crt;
        ssl_certificate_key /data/pki/apiserver.key;
        ssl_verify_client off;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /apis/user.openshift.io/v1 {
            default_type application/json;
            return 200 '{"kind":"APIResourceList","apiVersion":"v1","groupVersion":"user.openshift.io/v1","resources":[{"name":"users","singularName":"user","namespaced":false,"kind":"User","verbs":["get","list"]},{"name":"groups","singularName":"group","namespaced":false,"kind":"Group","verbs":["get","list"]}]}';
        }

        location = /apis/user.openshift.io/v1/users/~ {
            js_content main.proxyToHost;
        }

        location /apis/user.openshift.io/v1/users {
            js_content main.readOnlyProxy;
        }

        location /apis/user.openshift.io/v1/groups {
            js_content main.readOnlyProxy;
        }

        location / {
            default_type application/json;
            return 404 '{"kind":"Status","apiVersion":"v1","status":"Failure","message":"the server could not find the requested resource","reason":"NotFound","code":404}';
        }
    }
}
