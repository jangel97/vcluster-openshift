load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-user-api.pid;

events {
    worker_connections 64;
}

http {
    js_import main from /etc/nginx/proxy.js;
    js_fetch_verify off;

    client_body_temp_path /tmp/ua_client_body;
    proxy_temp_path /tmp/ua_proxy;
    fastcgi_temp_path /tmp/ua_fastcgi;
    uwsgi_temp_path /tmp/ua_uwsgi;
    scgi_temp_path /tmp/ua_scgi;

    server {
        listen 8446 ssl;

        ssl_certificate /data/pki/apiserver.crt;
        ssl_certificate_key /data/pki/apiserver.key;
        ssl_verify_client off;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Read-only proxy to host user.openshift.io API.
        # Preserves caller identity via Kubernetes impersonation headers.
        # Dual RBAC: vCluster kube-apiserver checks local RBAC before the
        # request reaches this proxy, then the host checks the impersonated
        # user's own permissions.

        location = /apis/user.openshift.io/v1 {
            default_type application/json;
            return 200 '{"kind":"APIResourceList","apiVersion":"v1","groupVersion":"user.openshift.io/v1","resources":[{"name":"users","singularName":"user","namespaced":false,"kind":"User","verbs":["get","list"]},{"name":"groups","singularName":"group","namespaced":false,"kind":"Group","verbs":["get","list"]}]}';
        }

        location = /apis/user.openshift.io/v1/users/~ {
            js_content main.proxyToHost;
        }

        location /apis/user.openshift.io/v1/users {
            js_content main.readOnlyProxy;
        }

        location /apis/user.openshift.io/v1/groups {
            js_content main.readOnlyProxy;
        }

        location / {
            default_type application/json;
            return 404 '{"kind":"Status","apiVersion":"v1","status":"Failure","message":"the server could not find the requested resource","reason":"NotFound","code":404}';
        }
    }
}
