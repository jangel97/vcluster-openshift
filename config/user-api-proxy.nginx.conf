worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-user-api.pid;

events {
    worker_connections 64;
}

http {
    client_body_temp_path /tmp/ua_client_body;
    proxy_temp_path /tmp/ua_proxy;
    fastcgi_temp_path /tmp/ua_fastcgi;
    uwsgi_temp_path /tmp/ua_uwsgi;
    scgi_temp_path /tmp/ua_scgi;

    server {
        listen 8446 ssl;

        ssl_certificate /data/pki/apiserver.crt;
        ssl_certificate_key /data/pki/apiserver.key;
        ssl_verify_client off;
        ssl_protocols TLSv1.2 TLSv1.3;

        # API discovery for user.openshift.io/v1
        location = /apis/user.openshift.io/v1 {
            default_type application/json;
            return 200 '{"kind":"APIResourceList","apiVersion":"v1","groupVersion":"user.openshift.io/v1","resources":[{"name":"users","singularName":"user","namespaced":false,"kind":"User","verbs":["get"]}]}';
        }

        # users/~ returns the authenticated user from X-Remote-User header
        location = /apis/user.openshift.io/v1/users/~ {
            default_type application/json;
            return 200 '{"apiVersion":"user.openshift.io/v1","kind":"User","metadata":{"name":"$http_x_remote_user"},"groups":[]}';
        }

        # Catch-all: return 404 for anything else
        location / {
            default_type application/json;
            return 404 '{"kind":"Status","apiVersion":"v1","status":"Failure","message":"the server could not find the requested resource","reason":"NotFound","code":404}';
        }
    }
}
