# Configuration for vcluster-openshift deployment.
# Edit this file to customize the deployment for your environment.

# Dedicated etcd sidecar for openshift-apiserver
etcd:
  image: quay.io/coreos/etcd:v3.5.17
  clientPort: 2479
  peerPort: 2480

# openshift-apiserver sidecar
openshiftApiserver:
  port: 8444

# CRDs to fetch from the host OCP cluster and install inside the vCluster.
# These satisfy openshift-apiserver admission plugin informer dependencies.
crds:
  - clusterresourcequotas.quota.openshift.io
  - imagecontentsourcepolicies.operator.openshift.io
  - imagedigestmirrorsets.config.openshift.io
  - imagetagmirrorsets.config.openshift.io
  - ingresses.config.openshift.io
  - securitycontextconstraints.security.openshift.io
